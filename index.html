            { title: "集結10年創業經驗《小電商賺大錢》", client: "沃口有限公司", category: "著做宣傳", date: "2025-12-12", role: "後製剪輯", views: "", link: "https://youtube.com/shorts/adYN32wfYqY" },
            { title: "意外發現餐廳秘境!海山里好厝邊", client: "元禾汽車", category: "二手汽車", date: "2025-01-05", role: "後製剪輯", views: "", link: "https://youtube.com/shorts/3jQkRQdssgI" },
            { title: "聖誕節必吃美食竟然是單字本?!", client: "吳凡數學", category: "補教業", date: "2024-12-20", role: "全案製作", views: "", link: "https://www.instagram.com/reel/DDzOHCRyJ03/" },
            { title: "只要30分鐘比你去醫X還有效！！", client: "Rebekah's美學", category: "美業相關", date: "2025-08-20", role: "後製剪輯", views: 151000, link: "https://www.instagram.com/reel/DNkuNh-xFRQ/" }
        ];

        // 縮圖路徑：featured 區塊需要
        const FALLBACK_THUMBNAIL = "縮圖替代.png"; 

        let currentSort = 'views'; // 預設改為流量排序
        
        // 解析 URL 參數
        const urlParams = new URLSearchParams(window.location.search);
        const highlightParam = urlParams.get('h') || urlParams.get('highlight') || urlParams.get('q') || urlParams.get('tag');

        const featuredContainer = document.getElementById('featured-container');
        const listContainer = document.getElementById('list-container');
        const sortSelect = document.getElementById('sort-select');
        const themeToggle = document.getElementById('theme-toggle');
        const htmlElement = document.documentElement;

        // 數字格式化 (改成完整數字格式，例如 110,000)
        function formatNumber(input) {
            if (typeof input !== 'number') return "-";
            return input.toLocaleString('en-US'); // 使用 toLocaleString 自動加上千分位逗號
        }

        // 圖片載入失敗處理
        window.handleImageError = function(img) {
            img.onerror = null; 
            img.src = FALLBACK_THUMBNAIL;
        }

        // 渲染頁面
        function render() {
            // 分離資料
            const featuredItems = portfolioData.filter(i => i.featured);
            let listItems = portfolioData.filter(i => !i.featured);

            // 1. 渲染精選區 (Featured Grid)
            featuredContainer.innerHTML = '';
            featuredItems.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = "group relative bg-white dark:bg-[#151515] border border-gray-100 dark:border-gray-800 rounded-2xl overflow-hidden shadow-card hover:shadow-card-hover transition-all duration-300";
                
                const thumb = item.thumbnail && item.thumbnail.trim() !== "" ? item.thumbnail : FALLBACK_THUMBNAIL;
                
                card.innerHTML = `
                    <a href="${item.link}" target="_blank" class="block aspect-video overflow-hidden relative">
                        <img src="${thumb}" alt="${item.title}" onerror="handleImageError(this)" 
                             class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-105">
                        <div class="absolute inset-0 bg-black/20 group-hover:bg-black/40 transition-colors flex items-center justify-center">
                            <div class="w-12 h-12 bg-white/90 rounded-full flex items-center justify-center shadow-lg transform scale-90 opacity-90 group-hover:scale-110 group-hover:opacity-100 transition-all text-brand-accent">
                                <i data-lucide="play" class="w-5 h-5 fill-current ml-1"></i>
                            </div>
                        </div>
                        <div class="absolute top-3 right-3">
                            <span class="px-2 py-1 bg-black/60 backdrop-blur-md rounded text-[10px] font-bold text-white tracking-wider border border-white/10">
                                ${item.category}
                            </span>
                        </div>
                    </a>
                    <div class="p-5">
                        <div class="flex justify-between items-center mb-2">
                            <span class="text-xs font-bold text-brand-accent uppercase tracking-widest">${item.client}</span>
                            <!-- 精選區流量：使用金色漸層字體 -->
                            <span class="text-sm font-black font-mono text-gradient-gold flex items-center gap-1">
                                <i data-lucide="eye" class="w-4 h-4 text-yellow-500"></i> ${formatNumber(item.views)}
                            </span>
                        </div>
                        <h3 class="text-lg font-bold text-slate-900 dark:text-white leading-snug mb-3 line-clamp-2 hover:text-brand-accent transition-colors">
                            <a href="${item.link}" target="_blank">${item.title}</a>
                        </h3>
                        <div class="pt-4 border-t border-gray-100 dark:border-gray-800 flex justify-between items-center text-xs text-slate-500">
                            <span>${item.role}</span>
                            <span>${item.date}</span>
                        </div>
                    </div>
                `;
                featuredContainer.appendChild(card);
            });

            // 2. 排序列表資料
            listItems.sort((a, b) => {
                if (currentSort === 'featured' && highlightParam) {
                    const keyword = highlightParam.toLowerCase();
                    const aMatch = (a.client && a.client.toLowerCase().includes(keyword)) || (a.category && a.category.toLowerCase().includes(keyword));
                    const bMatch = (b.client && b.client.toLowerCase().includes(keyword)) || (b.category && b.category.toLowerCase().includes(keyword));
                    if (aMatch && !bMatch) return -1;
                    if (!aMatch && bMatch) return 1;
                    return (typeof b.views === 'number' ? b.views : -1) - (typeof a.views === 'number' ? a.views : -1);
                }

                switch (currentSort) {
                    case 'date': return new Date(b.date) - new Date(a.date);
                    case 'views': 
                        let vA = (typeof a.views === 'number') ? a.views : -1;
                        let vB = (typeof b.views === 'number') ? b.views : -1;
                        return vB - vA;
                    case 'client': return a.client.localeCompare(b.client, 'zh-Hant');
                    case 'category': return a.category.localeCompare(b.category, 'zh-Hant');
                    default: return 0;
                }
            });

            // 3. 渲染列表區
            listContainer.innerHTML = '';
            listItems.forEach(item => {
                const row = document.createElement('div');
                
                // Desktop Layout
                const desktopHTML = `
                    <div class="hidden md:grid grid-cols-12 gap-4 px-6 py-4 items-center bg-white dark:bg-[#151515] border border-gray-100 dark:border-gray-800 rounded-xl hover:shadow-md hover:border-brand-accent/30 transition-all group">
                        <div class="col-span-5 font-medium text-slate-900 dark:text-white truncate pr-4">
                            <a href="${item.link}" target="_blank" class="hover:text-brand-accent flex items-center gap-2">
                                <span class="w-6 h-6 rounded-full bg-gray-100 dark:bg-gray-800 flex items-center justify-center text-gray-400 group-hover:bg-brand-accent group-hover:text-white transition-colors">
                                    <i data-lucide="play" class="w-3 h-3 fill-current ml-0.5"></i>
                                </span>
                                ${item.title}
                            </a>
                        </div>
                        <div class="col-span-2 text-sm text-slate-600 dark:text-gray-400 truncate">${item.client}</div>
                        <div class="col-span-2 text-sm font-mono text-slate-500 dark:text-gray-500">${formatNumber(item.views)}</div>
                        <div class="col-span-2">
                            <!-- 列表區角色標籤：增加底色與樣式 -->
                            <span class="inline-block px-3 py-1 bg-slate-200 dark:bg-slate-700 text-slate-700 dark:text-slate-200 rounded-md text-xs font-medium border border-slate-300 dark:border-slate-600">
                                ${item.role}
                            </span>
                        </div>
                        <div class="col-span-1 text-right text-xs font-mono text-slate-400">${item.date}</div>
                    </div>
                `;

                // Mobile Layout
                const mobileHTML = `
                    <a href="${item.link}" target="_blank" class="block md:hidden bg-white dark:bg-[#151515] p-4 rounded-xl border border-gray-100 dark:border-gray-800 shadow-sm active:scale-[0.98] transition-transform">
                        <h3 class="font-bold text-slate-900 dark:text-white mb-2 leading-snug line-clamp-2">${item.title}</h3>
                        <div class="flex justify-between items-center text-xs text-slate-500 dark:text-gray-400 mb-3">
                            <span class="font-medium text-brand-accent truncate max-w-[50%]">${item.client}</span>
                            <!-- 手機版也加上標籤樣式 -->
                            <span class="inline-block px-2 py-0.5 bg-slate-100 dark:bg-slate-800 rounded text-xs text-slate-600 dark:text-gray-400 border border-slate-200 dark:border-slate-700">${item.role}</span>
                        </div>
                        <div class="flex justify-between items-end border-t border-gray-100 dark:border-gray-800 pt-3">
                            <div class="flex flex-col gap-1">
                                <span class="text-xs font-mono text-slate-400">${item.date}</span>
                                <span class="text-sm font-bold font-mono text-slate-700 dark:text-gray-300 flex items-center gap-1">
                                    <i data-lucide="eye" class="w-3 h-3"></i> ${formatNumber(item.views)}
                                </span>
                            </div>
                            <span class="w-8 h-8 rounded-full bg-brand-accent text-white flex items-center justify-center shadow-lg">
                                <i data-lucide="play" class="w-3.5 h-3.5 fill-current ml-0.5"></i>
                            </span>
                        </div>
                    </a>
                `;

                row.innerHTML = desktopHTML + mobileHTML;
                listContainer.appendChild(row);
            });
            
            lucide.createIcons();
        }

        // ==========================================
        // 互動邏輯
        // ==========================================
        
        if (highlightParam) {
            const featuredOption = document.createElement('option');
            featuredOption.value = 'featured';
            featuredOption.text = '相關優先';
            sortSelect.insertBefore(featuredOption, sortSelect.firstChild);
            sortSelect.value = 'featured';
            currentSort = 'featured';
        } else {
            currentSort = 'views';
            sortSelect.value = 'views';
        }

        sortSelect.addEventListener('change', (e) => {
            currentSort = e.target.value;
            render();
        });

        themeToggle.addEventListener('click', () => {
            htmlElement.classList.toggle('dark');
            localStorage.theme = htmlElement.classList.contains('dark') ? 'dark' : 'light';
            setTimeout(() => lucide.createIcons(), 50);
        });

        if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            htmlElement.classList.remove('dark');
        } else {
            htmlElement.classList.remove('dark');
        }

        render();

    </script>
</body>
</html>
