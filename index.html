<!DOCTYPE html>
<html lang="zh-TW" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ROCK Studio｜短影音作品集</title>
    
    <!-- 字型：Noto Sans TC -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- 圖標庫 (Lucide) -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Tailwind 設定 -->
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Noto Sans TC', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            light: '#0F172A', 
                            accent: '#2563EB', // 加亮一點的藍色，適合按鈕
                            dark: '#F8FAFC',  
                        }
                    },
                    animation: {
                        'fade-in-up': 'fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards',
                    },
                    boxShadow: {
                        'card': '0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03)',
                        'card-hover': '0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04)',
                    }
                }
            }
        }
    </script>

    <style>
        /* 全局平滑過渡 */
        body, div, nav, button, table, th, td, select, img, a {
            transition: all 0.3s ease;
        }
        
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* 毛玻璃導航 */
        .glass-effect {
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            background: rgba(255, 255, 255, 0.8);
            border-bottom: 1px solid rgba(0,0,0,0.05);
        }
        .dark .glass-effect {
            background: rgba(23, 23, 23, 0.8);
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        /* 關鍵動畫定義 (防止被 JIT 移除) */
        @keyframes fadeInUp {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        @keyframes scaleIn {
            0% { opacity: 0; transform: scale(0.98); }
            100% { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body class="bg-gray-50 text-slate-800 dark:bg-[#0f0f0f] dark:text-gray-200 min-h-screen flex flex-col font-sans antialiased">

    <!-- 頂部導航列 -->
    <nav class="sticky top-0 z-50 w-full glass-effect">
        <div class="max-w-screen-xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <!-- LOGO -->
                <div class="flex items-center gap-3">
                    <div class="w-8 h-8 bg-brand-light dark:bg-white rounded-md flex items-center justify-center text-white dark:text-black font-bold text-sm shadow-md">
                        P
                    </div>
                    <span class="font-bold text-lg tracking-wider uppercase text-slate-900 dark:text-white">Portfolio</span>
                </div>

                <!-- Dark Mode Toggle -->
                <button id="theme-toggle" class="p-2 rounded-full hover:bg-gray-100 dark:hover:bg-white/10 text-slate-500 dark:text-slate-400">
                    <i data-lucide="moon" class="w-5 h-5 block dark:hidden"></i>
                    <i data-lucide="sun" class="w-5 h-5 hidden dark:block text-yellow-300"></i>
                </button>
            </div>
        </div>
    </nav>

    <!-- 主要內容區 -->
    <main class="flex-grow max-w-screen-xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full">
        
        <!-- 標頭簡介 -->
        <header class="mb-10 text-center md:text-left animate-fade-in-up">
            <h1 class="text-3xl sm:text-4xl font-bold text-slate-900 dark:text-white mb-3">
                精選短影音作品
            </h1>
            <p class="text-slate-500 dark:text-gray-400 text-base max-w-2xl mx-auto md:mx-0 leading-relaxed">
                專注於視覺節奏與品牌敘事。點擊下方作品即可觀看完整內容。
            </p>
        </header>

        <!-- 控制工具列 -->
        <div class="sticky top-20 z-40 mb-10 animate-fade-in-up" style="animation-delay: 0.1s;">
            <div class="bg-white dark:bg-[#1a1a1a] border border-gray-200 dark:border-gray-800 rounded-xl p-3 shadow-lg flex flex-col sm:flex-row justify-between items-center gap-3">
                
                <!-- 排序選單 (優化手機顯示) -->
                <div class="flex items-center gap-3 w-full sm:w-auto px-2">
                    <div class="flex items-center gap-2 text-slate-500 dark:text-gray-400 whitespace-nowrap">
                        <i data-lucide="arrow-up-down" class="w-4 h-4"></i>
                        <span class="text-sm font-medium">排序依據：</span>
                    </div>
                    <div class="relative flex-grow sm:flex-grow-0">
                        <select id="sort-select" class="w-full sm:w-48 bg-gray-50 dark:bg-neutral-800 border-none text-sm font-medium text-slate-900 dark:text-white rounded-lg py-2 pl-3 pr-8 focus:ring-2 focus:ring-brand-accent cursor-pointer appearance-none">
                            <option value="date">日期 (最新優先)</option>
                            <option value="client">客戶名稱</option>
                            <option value="category">專案類別</option>
                        </select>
                        <i data-lucide="chevron-down" class="w-4 h-4 absolute right-2 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none"></i>
                    </div>
                </div>

                <!-- 檢視模式切換 (手機隱藏) -->
                <div class="hidden md:flex bg-gray-100 dark:bg-neutral-800 rounded-lg p-1 gap-1">
                    <button id="view-grid" class="flex items-center gap-2 px-4 py-1.5 rounded-md text-sm font-medium transition-all text-slate-900 dark:text-white bg-white dark:bg-neutral-700 shadow-sm">
                        <i data-lucide="layout-grid" class="w-4 h-4"></i>
                        區塊
                    </button>
                    <button id="view-table" class="flex items-center gap-2 px-4 py-1.5 rounded-md text-sm font-medium transition-all text-slate-500 dark:text-gray-400 hover:text-slate-900 dark:hover:text-white">
                        <i data-lucide="list" class="w-4 h-4"></i>
                        列表
                    </button>
                </div>
            </div>
        </div>

        <!-- 內容容器 -->
        <div id="portfolio-container" class="min-h-[400px] animate-fade-in-up" style="animation-delay: 0.2s;">
            <!-- Render Content Here -->
        </div>

    </main>

    <!-- 頁尾 -->
    <footer class="border-t border-gray-200 dark:border-gray-800 bg-white dark:bg-[#1a1a1a] mt-16">
        <div class="max-w-screen-xl mx-auto py-8 px-4 flex flex-col md:flex-row justify-between items-center gap-4">
            <p class="text-slate-500 text-sm">© 2024 Video Portfolio.</p>
            <div class="flex gap-6">
                <a href="#" class="text-slate-400 hover:text-brand-accent transition-colors"><i data-lucide="instagram" class="w-5 h-5"></i></a>
                <a href="#" class="text-slate-400 hover:text-brand-accent transition-colors"><i data-lucide="mail" class="w-5 h-5"></i></a>
            </div>
        </div>
    </footer>

    <script>
        // ==========================================
        // 1. 資料設定
        // ==========================================
        const portfolioData = [
            {
                id: 1,
                title: "小允兒 x 京藥妝奈米微晶拉提組",
                client: "GREENEOLD台灣綠金家園",
                category: "保養品",
                date: "2025-09-15",
                role: "純剪輯",
                link: "https://youtube.com/shorts/VHiq0ll1ZmU",
                thumbnail: "" 
            },
            {
                id: 2,
                title: "青島佩 x momochan金賞葡聚醣",
                client: "GREENEOLD台灣綠金家園",
                category: "保健食品",
                date: "2025-09-18",
                role: "純剪輯",
                link: "https://youtube.com/shorts/nY6yX4J-lR8?feature=share",
                thumbnail: "" 
            },
            {
                id: 3,
                title: "新品上市 15s 廣告",
                client: "Samsung",
                category: "3C 電子",
                date: "2024-01-05",
                role: "特效 & 動畫",
                link: "https://www.youtube.com/watch?v=LXb3EKWsInQ",
                thumbnail: ""
            },
            {
                id: 4,
                title: "風格露營 VLOG",
                client: "Snow Peak",
                category: "戶外生活",
                date: "2023-10-10",
                role: "剪輯",
                link: "https://www.youtube.com/watch?v=dummy",
                thumbnail: "https://images.unsplash.com/photo-1504280390367-361c6d9f38f4?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80"
            },
            {
                id: 5,
                title: "咖啡沖煮教學 Reels",
                client: "Blue Bottle",
                category: "餐飲食品",
                date: "2023-09-01",
                role: "拍攝 & 剪輯",
                link: "#",
                thumbnail: "https://images.unsplash.com/photo-1497935586351-b67a49e012bf?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80"
            },
            {
                id: 6,
                title: "豪華房地產導覽",
                client: "蘇富比房地產",
                category: "房產",
                date: "2024-01-20",
                role: "後製特效",
                link: "#",
                thumbnail: "https://images.unsplash.com/photo-1600596542815-22b5d010e51e?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80"
            }
        ];

        const FALLBACK_THUMBNAIL = "縮圖替代.png"; 
        const DEMO_FALLBACK = "https://placehold.co/800x600/f1f5f9/94a3b8?text=Project";

        let currentView = 'grid'; 
        let currentSort = 'date';
        let items = [...portfolioData];

        const container = document.getElementById('portfolio-container');
        const btnGrid = document.getElementById('view-grid');
        const btnTable = document.getElementById('view-table');
        const sortSelect = document.getElementById('sort-select');
        const themeToggle = document.getElementById('theme-toggle');
        const htmlElement = document.documentElement;

        // ==========================================
        // 解析縮圖 & 錯誤處理
        // ==========================================
        function resolveThumbnail(item) {
            if (item.thumbnail && item.thumbnail.trim() !== "") return item.thumbnail;
            if (item.link) {
                const regExp = /^.*((youtu.be\/)|(v\/)|(\/u\/\w\/)|(embed\/)|(watch\?v=)|(shorts\/))([^#&?]*).*/;
                const match = item.link.match(regExp);
                if (match && match[8].length == 11) {
                    return `https://img.youtube.com/vi/${match[8]}/maxresdefault.jpg`;
                }
            }
            return FALLBACK_THUMBNAIL;
        }

        window.handleImageError = function(img) {
            img.onerror = null; 
            if (img.src.includes(FALLBACK_THUMBNAIL)) {
                 img.src = DEMO_FALLBACK;
            } else {
                 img.src = FALLBACK_THUMBNAIL;
            }
        }

        function sortItems() {
            items.sort((a, b) => {
                switch (currentSort) {
                    case 'date': return new Date(b.date) - new Date(a.date);
                    case 'client': return a.client.localeCompare(b.client, 'zh-Hant');
                    case 'category': return a.category.localeCompare(b.category, 'zh-Hant');
                    default: return 0;
                }
            });
            render();
        }

        // ==========================================
        // 渲染邏輯
        // ==========================================
        function render() {
            container.innerHTML = '';
            container.style.opacity = '0';
            
            setTimeout(() => {
                // 強制檢查：如果是手機版，無論如何都渲染 Grid
                if (window.innerWidth < 768) {
                    renderGridView();
                } else {
                    if (currentView === 'grid') renderGridView();
                    else renderTableView();
                }
                
                lucide.createIcons();
                container.style.opacity = '1';
            }, 100);
        }

        function renderGridView() {
            // Gap 調整為 gap-8 md:gap-10，讓卡片分離更明顯
            // 手機版單欄 (grid-cols-1)
            const gridWrapper = document.createElement('div');
            gridWrapper.className = 'grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8 md:gap-10 pb-10';

            items.forEach((item, index) => {
                const card = document.createElement('div');
                // 為卡片加上明顯的背景色與邊框，解決「黏在一起」的問題
                card.className = 'group flex flex-col bg-white dark:bg-[#151515] border border-gray-100 dark:border-gray-800 rounded-2xl overflow-hidden shadow-card hover:shadow-card-hover transition-all duration-300';
                card.style.animation = `scaleIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards ${index * 0.05}s`;
                card.style.opacity = '0';

                const thumbnailSrc = resolveThumbnail(item);

                card.innerHTML = `
                    <!-- 上方：圖片區 (點擊也可觀看) -->
                    <a href="${item.link}" target="_blank" class="relative w-full aspect-video overflow-hidden bg-gray-200 dark:bg-gray-800">
                        <img 
                            src="${thumbnailSrc}" 
                            alt="${item.title}" 
                            onerror="handleImageError(this)"
                            class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-105"
                        >
                        <!-- 播放按鈕遮罩 -->
                        <div class="absolute inset-0 bg-black/10 group-hover:bg-black/30 transition-colors flex items-center justify-center">
                            <div class="w-12 h-12 bg-white/90 rounded-full flex items-center justify-center shadow-lg transform scale-90 opacity-90 group-hover:scale-110 group-hover:opacity-100 transition-all duration-300 text-brand-accent">
                                <i data-lucide="play" class="w-5 h-5 fill-current ml-1"></i>
                            </div>
                        </div>
                        <!-- 左上角類別標籤 -->
                        <div class="absolute top-3 left-3">
                             <span class="px-2.5 py-1 bg-black/60 backdrop-blur-md rounded-md text-[10px] font-bold text-white tracking-wider uppercase border border-white/10">
                                ${item.category}
                            </span>
                        </div>
                    </a>

                    <!-- 下方：資訊與按鈕區 -->
                    <div class="p-5 flex flex-col flex-grow">
                        <div class="flex justify-between items-center mb-2">
                            <span class="text-xs font-bold text-brand-accent uppercase tracking-widest">${item.client}</span>
                            <span class="text-xs text-slate-400 font-mono">${item.date}</span>
                        </div>
                        
                        <h3 class="text-lg font-bold text-slate-900 dark:text-gray-100 leading-snug mb-3 line-clamp-2">
                            ${item.title}
                        </h3>
                        
                        <div class="mt-auto pt-4 border-t border-gray-100 dark:border-gray-800 flex items-center justify-between">
                            <span class="text-xs text-slate-500 dark:text-gray-500 font-medium">
                                ${item.role}
                            </span>
                            
                            <!-- 明確的觀看按鈕 -->
                            <a href="${item.link}" target="_blank" class="flex items-center gap-1.5 px-4 py-2 bg-brand-accent hover:bg-blue-700 text-white text-xs font-bold rounded-full transition-colors shadow-md hover:shadow-lg transform active:scale-95">
                                點擊觀看
                                <i data-lucide="external-link" class="w-3 h-3"></i>
                            </a>
                        </div>
                    </div>
                `;
                gridWrapper.appendChild(card);
            });
            container.appendChild(gridWrapper);
        }

        function renderTableView() {
            const tableWrapper = document.createElement('div');
            tableWrapper.className = 'w-full animate-fade-in-up bg-white dark:bg-[#151515] rounded-xl border border-gray-100 dark:border-gray-800 overflow-hidden';

            let html = `
                <div class="w-full overflow-x-auto no-scrollbar">
                    <table class="w-full text-left border-collapse">
                        <thead class="bg-gray-50 dark:bg-black/20">
                            <tr>
                                <th class="py-4 px-6 text-xs font-bold text-slate-400 uppercase tracking-wider">專案</th>
                                <th class="py-4 px-6 text-xs font-bold text-slate-400 uppercase tracking-wider">客戶</th>
                                <th class="py-4 px-6 text-xs font-bold text-slate-400 uppercase tracking-wider">負責內容</th>
                                <th class="py-4 px-6 text-xs font-bold text-slate-400 uppercase tracking-wider text-right">操作</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-gray-100 dark:divide-gray-800">
            `;

            items.forEach((item) => {
                const thumbnailSrc = resolveThumbnail(item);
                html += `
                    <tr class="group hover:bg-gray-50 dark:hover:bg-white/5 transition-colors">
                        <td class="py-4 px-6">
                            <div class="flex items-center gap-4">
                                <div class="w-20 aspect-video rounded-md overflow-hidden bg-gray-200 dark:bg-gray-700 flex-shrink-0 relative">
                                    <img class="w-full h-full object-cover" src="${thumbnailSrc}" alt="" onerror="handleImageError(this)">
                                </div>
                                <span class="font-medium text-slate-900 dark:text-white text-sm group-hover:text-brand-accent transition-colors">${item.title}</span>
                            </div>
                        </td>
                        <td class="py-4 px-6 text-sm text-slate-600 dark:text-gray-400">${item.client}</td>
                        <td class="py-4 px-6">
                            <span class="inline-block px-2 py-1 bg-gray-100 dark:bg-gray-800 rounded text-xs text-slate-600 dark:text-gray-400">${item.role}</span>
                        </td>
                        <td class="py-4 px-6 text-right">
                             <a href="${item.link}" target="_blank" class="inline-flex items-center justify-center w-8 h-8 rounded-full bg-brand-accent/10 text-brand-accent hover:bg-brand-accent hover:text-white transition-all">
                                <i data-lucide="play" class="w-3.5 h-3.5 fill-current ml-0.5"></i>
                            </a>
                        </td>
                    </tr>
                `;
            });

            html += `</tbody></table></div>`;
            tableWrapper.innerHTML = html;
            container.appendChild(tableWrapper);
        }

        // ==========================================
        // 事件監聽與初始化
        // ==========================================
        
        // 切換按鈕 UI 更新
        function updateViewButtons(mode) {
            const activeClass = ['bg-white', 'dark:bg-neutral-700', 'text-slate-900', 'dark:text-white', 'shadow-sm'];
            const inactiveClass = ['text-slate-500', 'dark:text-gray-400', 'hover:text-slate-900', 'dark:hover:text-white'];
            
            if (mode === 'grid') {
                btnGrid.classList.add(...activeClass);
                btnGrid.classList.remove(...['text-slate-500', 'hover:text-slate-900']);
                btnTable.classList.remove(...activeClass);
                btnTable.classList.add(...inactiveClass);
            } else {
                btnTable.classList.add(...activeClass);
                btnTable.classList.remove(...['text-slate-500', 'hover:text-slate-900']);
                btnGrid.classList.remove(...activeClass);
                btnGrid.classList.add(...inactiveClass);
            }
        }

        btnGrid.addEventListener('click', () => {
            currentView = 'grid';
            updateViewButtons('grid');
            render();
        });

        btnTable.addEventListener('click', () => {
            currentView = 'table';
            updateViewButtons('table');
            render();
        });

        sortSelect.addEventListener('change', (e) => {
            currentSort = e.target.value;
            sortItems();
        });

        themeToggle.addEventListener('click', () => {
            htmlElement.classList.toggle('dark');
            localStorage.theme = htmlElement.classList.contains('dark') ? 'dark' : 'light';
            setTimeout(() => lucide.createIcons(), 50);
        });

        // 視窗變更監聽
        window.addEventListener('resize', () => {
            if (window.innerWidth < 768 && currentView === 'table') {
                currentView = 'grid'; // 強制切回 Grid
                render();
            }
        });

        // 初始狀態檢查
        if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            // htmlElement.classList.add('dark'); // 依需求預設淺色
            htmlElement.classList.remove('dark');
        } else {
            htmlElement.classList.remove('dark');
        }

        updateViewButtons('grid');
        sortItems();

    </script>
</body>
</html>
